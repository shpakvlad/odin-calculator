<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./styles/colors.css">
    <link rel="stylesheet" href="./styles/style.css">
    <script src="./scripts/script.js" defer></script>

    <title>Simply calculator | The Odin Project</title>
</head>
<body>

<header>
    <h2>Simply calculator</h2>
</header>
<main>
    <div class="container">
        <div class="calculator-case">
            <div class="screen-panel">
                <div class="screen">0</div>

            </div>

            <div class="keyboard-panel">
                <button class="button number1">1</button>
                <button class="button number2">2</button>
                <button class="button number3">3</button>
                <button class="button number4">4</button>
                <button class="button number5">5</button>
                <button class="button number6">6</button>
                <button class="button number7">7</button>
                <button class="button number8">8</button>
                <button class="button number9">9</button>
                <button class="button number0">0</button>
                <button class="button numberC">C</button>
                <button class="button number-plus">+</button>
                <button class="button number-minus">&ndash;</button>
                <button class="button number-divide">&divide;</button>
                <button class="button number-multiple">&times;</button>
                <button class="button number-equal">=</button>
                <button class="button number-dot">,</button>
            </div>
        </div>
    </div>
</main>
<footer>
    <p>Copyright &copy Vladyslav Shpakov 2026</p>
</footer>
</body>
</html>
